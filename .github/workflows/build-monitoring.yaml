# ---------------------------------------------------------------------------
# Coherence CLI GitHub Actions CI Build Monitoring
# ---------------------------------------------------------------------------
name: CI Build Monitoring

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - gh-pages

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    #   Checkout the source, we need a depth of zero to fetch all of the history otherwise
    #   the copyright check cannot work out the date of the files from Git.
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Cache Go Modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-mods-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-mods-

      - name: Cache Maven packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: ${{ runner.os }}-m2

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: 'go.mod'

      - name: Validate Grafana credential delivery on Linux
        shell: bash
        run: |
          set -euo pipefail
          docker pull busybox:1.37.0
          docker compose -f monitoring/docker-compose.yaml pull grafana
          COHCTL_TEST_MONITORING_DOCKER=1 go test -count=1 ./pkg/cmd -run '^TestGrafana(SecretDeliveryLinux|GeneratedPasswordAuthentication)$'

      - name: Build and Test Monitoring
        shell: bash
        run: |
          set -euo pipefail
          make cohctl
          PATH="$(pwd)/bin:${PATH}"
          export PATH

          # Validate the templates from this checkout rather than GitHub main.
          if grep -Eq '^[[:space:]]*admin_password[[:space:]]*=' monitoring/grafana.ini; then
            echo "The tracked Grafana configuration contains an administrator password" >&2
            exit 1
          fi
          tracked_config="$(mktemp)"
          docker compose -f monitoring/docker-compose.yaml config > "${tracked_config}"
          test "$(grep -c 'host_ip: 127.0.0.1' "${tracked_config}")" -eq 2
          rm -f "${tracked_config}"

          init_output="$(mktemp)"
          cohctl init monitoring -y > "${init_output}"
          sed -E 's/^(Grafana administrator password: ).*/\1<redacted>/' "${init_output}"
          rm -f "${init_output}"

          monitoring_dir="${HOME}/.cohctl/monitoring"
          generated_compose="${monitoring_dir}/docker-compose.cohctl.yaml"
          monitoring_env="${monitoring_dir}/monitoring.env"
          password_file="${monitoring_dir}/grafana-admin-password"
          test "$(stat -c '%a' "${password_file}")" = "600"

          generated_config="$(mktemp)"
          docker compose --env-file "${monitoring_env}" -f "${generated_compose}" config > "${generated_config}"
          test "$(grep -c 'host_ip: 127.0.0.1' "${generated_config}")" -eq 2
          rm -f "${generated_config}"

          trap 'cohctl stop monitoring -y || true' EXIT
          cohctl start monitoring
          grafana_ready=false
          for _ in {1..30}; do
            if curl -fsS http://127.0.0.1:3000/api/health >/dev/null; then
              grafana_ready=true
              break
            fi
            sleep 2
          done
          test "${grafana_ready}" = "true"
          test "$(docker compose --env-file "${monitoring_env}" -f "${generated_compose}" port grafana 3000)" = "127.0.0.1:3000"
          test "$(docker compose --env-file "${monitoring_env}" -f "${generated_compose}" port prometheus 9090)" = "127.0.0.1:9090"
          docker compose --env-file "${monitoring_env}" -f "${generated_compose}" exec -T prometheus sh -c 'test ! -e /run/secrets/grafana_admin_password'

          grafana_password="$(< "${password_file}")"
          printf 'user = "admin:%s"\n' "${grafana_password}" | curl --config - -fsS http://127.0.0.1:3000/api/org >/dev/null
          if curl -fsS -u admin:admin http://127.0.0.1:3000/api/org >/dev/null; then
            echo "Grafana unexpectedly accepted admin/admin" >&2
            exit 1
          fi
          cohctl get monitoring
          curl -fsS http://127.0.0.1:9090/-/healthy
          cohctl stop monitoring -y
          trap - EXIT

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: test-output
          path: build/_output/test-logs
